version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gomatric-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=api/v1
      - MONGODB_URI=mongodb://mongodb:27017/gomatric
      - JWT_ACCESS_SECRET=gomatric_prod_access_secret_change_me_in_prod!
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=gomatric_prod_refresh_secret_change_me_in_prod!
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_MAX=100
      - SWAGGER_ENABLED=true
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: gomatric-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
